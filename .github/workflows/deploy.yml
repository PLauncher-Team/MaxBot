name: Deploy MaxBot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxbot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: 195.133.35.201
      DEPLOY_PATH: /var/www/maxapp
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]] || { echo "::error::Select a branch to deploy"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$DEPLOY_SSH_USER" || { echo "::error::Missing DEPLOY_SSH_USER"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Missing DEPLOY_SSH_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Check server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_SSH_USER@$DEPLOY_HOST" "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/ecosystem.config.js' && command -v rsync && command -v npm && command -v pm2"

      - name: Upload application files
        shell: bash
        run: |
          set -euo pipefail
          rsync -az -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.android-studio/' \
            --exclude='node_modules/' \
            --exclude='data/' \
            --exclude='ecosystem.config.js' \
            --exclude='package-lock.json' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='logs/' \
            --exclude='*.log' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_SSH_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Install production dependencies
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_SSH_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && npm install --omit=dev"

      - name: Restart application
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_SSH_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && pm2 startOrReload ecosystem.config.js --update-env && pm2 save && pm2 status"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## MaxBot deployment completed"
            echo ""
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Server: $DEPLOY_HOST"
            echo "- Path: $DEPLOY_PATH"
          } >> "$GITHUB_STEP_SUMMARY"
