name: Deploy MaxBot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxbot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: 195.133.35.201
      DEPLOY_PATH: /var/www/maxapp
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Validate deployment settings and pin SSH host key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo "::error::Missing DEPLOY_SSH_PASSWORD"; exit 1; }
          test -n "$DEPLOY_SSH_USER" || { echo "::error::Missing DEPLOY_SSH_USER"; exit 1; }
          if [[ -n "$DEPLOY_SSH_KNOWN_HOSTS" ]]; then
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || { echo "::error::Known-hosts secret does not contain the deployment host"; exit 1; }
            printf '%s\n' "SSH_HOST_KEY_OPTIONS=-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
          else
            echo "::warning::DEPLOY_SSH_KNOWN_HOSTS is not configured; using the legacy SSH connection mode without host-key verification"
            printf '%s\n' 'SSH_HOST_KEY_OPTIONS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' >> "$GITHUB_ENV"
          fi

      - name: Run security tests and syntax checks
        run: |
          set -euo pipefail
          npm install --omit=dev @node-projects/excelforge@3.8.0
          npm ls --omit=dev @node-projects/excelforge
          node --input-type=module -e "await import('@node-projects/excelforge'); console.log('ExcelForge is available')"
          npm test
          for file in auth.js server.js bot.js scheduler.js xlsx.js routes/*.js js/*.js js/screens/*.js test/*.js; do
            node --check "$file"
          done

      - name: Resolve and audit production dependencies
        run: |
          set -euo pipefail
          npm install --package-lock-only --omit=dev
          npm audit --omit=dev --audit-level=high

      - name: Check server
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no $SSH_HOST_KEY_OPTIONS "$DEPLOY_SSH_USER@$DEPLOY_HOST" "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/ecosystem.config.js' && command -v rsync && command -v npm && command -v pm2"

      - name: Upload application files
        shell: bash
        run: |
          set -euo pipefail
          rsync -az -e "sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no $SSH_HOST_KEY_OPTIONS" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.android-studio/' \
            --exclude='node_modules/' \
            --exclude='data/' \
            --exclude='ecosystem.config.js' \
            --exclude='package-lock.json' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='logs/' \
            --exclude='*.log' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_SSH_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Install production dependencies
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no $SSH_HOST_KEY_OPTIONS "$DEPLOY_SSH_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && npm install --omit=dev"

      - name: Restart application
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no $SSH_HOST_KEY_OPTIONS "$DEPLOY_SSH_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && pm2 startOrReload ecosystem.config.js --update-env && pm2 save && pm2 status"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## MaxBot deployment completed"
            echo ""
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Server: $DEPLOY_HOST"
            echo "- Path: $DEPLOY_PATH"
          } >> "$GITHUB_STEP_SUMMARY"
